
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Rapido</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="site-header">

        <nav class="navbar navbar-expand-lg rapido-navbar">
            <div class="container">

                <!-- Rapido Logo -->
                <a class="navbar-brand" href="#">
                    <img src="./Assets/NewLogo.svg" alt="Rapido Logo">
                </a>

                <!-- Mobile Navbar Button -->
                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navigation Links -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <div class="navbar-nav rapido-nav ms-auto">

                        <a class="nav-link active" href="#">Home</a>
                        <a class="nav-link" href="#">About Us</a>
                        <a class="nav-link" href="#">Safety</a>
                        <a class="nav-link" href="#">Careers</a>
                        <a class="nav-link" href="#">Blog</a>
                        <a class="nav-link" href="#">Press</a>
                        <a class="nav-link" href="#">Contact Us</a>

                        <a href="#" class="download-btn">
                            Download App
                        </a>

                    </div>
                </div>

            </div>
        </nav>

    </header>


    <!-- HERO SECTION -->
    <main class="hero-section">

        <div class="container">

            <div class="row align-items-center hero-row">

                <!-- LEFT COLUMN: TEXT AND BOOKING FORM -->
                <div class="col-12 col-lg-6 hero-content">

                    <h1 class="hero-title">
                        India's #1<br>
                        Ride-hailing App
                    </h1>

                    <p class="hero-subtitle">
                        Quick, Affordable rides at your doorstep
                    </p>

                    <!-- Pickup and Drop Form -->
                    <form class="booking-form" action="#" method="get">

                        <!-- Pickup Location -->
                        <label class="location-box">

                            <span class="location-icon">
                                <i class="fa-solid fa-location-dot"></i>
                            </span>

                            <input
                                type="text"
                                name="pickup"
                                placeholder="Enter Pickup Location"
                                aria-label="Enter Pickup Location">

                        </label>


                        <!-- Drop Location -->
                        <label class="location-box">

                            <span class="drop-icon">
                                <i class="fa-solid fa-circle-dot"></i>
                            </span>

                            <input
                                type="text"
                                name="drop"
                                placeholder="Enter Drop Location"
                                aria-label="Enter Drop Location">

                        </label>


                        <button class="book-ride-btn" type="submit">
                            Book Ride
                        </button>

                    </form>

                </div>

                <div class="col-12 col-lg-6 hero-image-column">

                    <img
                        src="./Assets/banner_image_new.png"
                        class="hero-image img-fluid"
                        alt="Rapido bike, auto and cab services">

                </div>

            </div>

        </div>

    </main>

    
<!-- OUR SERVICES SECTION -->
<section class="services-section">

    <div class="container">

        <!-- Section Heading -->
        <h2 class="services-title">Our Services</h2>
        <div class="title-underline"></div>

        <!-- Services Grid -->
        <div class="row services-row">

            <!-- Bike Taxi -->
            <div class="col-12 col-md-6 col-lg-4">
                <img src="./Assets/serviceimage.svg"
                     class="service-image"
                     alt="Bike Taxi">
            </div>

            <!-- Auto -->
            <div class="col-12 col-md-6 col-lg-4">
                <img src="./Assets/auto_service.png"
                     class="service-image"
                     alt="Auto">
            </div>

            <!-- Cab -->
            <div class="col-12 col-md-6 col-lg-4">
                <img src="./Assets/cab_service.png"
                     class="service-image"
                     alt="Cab">
            </div>

            <!-- Parcel -->
            <div class="col-12 col-md-6 col-lg-4">
                <img src="./Assets/parcel_service.png"
                     class="service-image"
                     alt="Parcel">
            </div>

            <!-- Travel and Stay -->
            <div class="col-12 col-md-6 col-lg-4">
                <img src="./Assets/travel_service.png"
                     class="service-image"
                     alt="Travel and Stay">
            </div>

            <!-- Metro Ticket -->
            <div class="col-12 col-md-6 col-lg-4">
                <img src="./Assets/metro_service.png"
                     class="service-image"
                     alt="Metro Ticket">
            </div>

        </div>

    </div>

</section>



    <script src="https://kit.fontawesome.com/079c2998c3.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
