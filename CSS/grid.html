<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            display: grid;
            grid-template-columns: auto auto auto;
            /* grid-template-columns: 30% 20% 50%; */
            background-color: blue;
            column-gap: 30px;
        }
        .container div{
            background-color: white;
            margin: 10px;
            padding: 20px;
            
        }
        #itm1{
            align-content: center; /*vertically align the whole grid inside the container*/
            align-items: end; /*specifies the default alignment for items inside a flexbox or grid*/
            align-self: self-start; /*align content for specific grid items along column axis*/
            /* column-gap: for giving space between columns
            gap: shorthand property for rows and column gap */
        }
    </style>
</head>
<body>

    <div class="container">
    <div id="itm1">Item1</div>
    <div id="itm2">Item2</div>
    <div id="itm3">Item3</div>
    <div id="itm4">Item4</div>
    <div>Item5</div>
    </div>
    
</body>
</html>
