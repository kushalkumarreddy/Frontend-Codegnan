<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .container {
            width: 700px;
            height: 500px;
            border: 4px solid black;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            background-color: chartreuse;
            border: 4px solid green;
            padding: 5px;
        }

        .box {
            width: 500px;
            height: 200px;
            background-color: yellow;
            border: 5px solid red;
            margin: 100px auto;
        }

        .box h2 {
            text-align: center;
            margin-top: 70px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Box-Model Property</h1>

        <div class="box">
            <h2>Content Area</h2>
        </div>

    </div>

</body>
</html>
