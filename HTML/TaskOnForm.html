<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form style="border: 2px solid red ;width:50%;">

    <h1 style = "text-align : center">Student Registration Form</h1>
    <p>Fill in this form to register</p>

        <label>First Name: </label>
        <input type = "text" placeholder="Enter your first name">
        <br><br>

        <label>Last Name: </label>
        <input type = "text" placeholder="Enter your last name">
        <br><br>

        <label>Email: </label>
        <input type = "email" placeholder="Enter your Email">
        <br><br>

        <label>Date of Birth</label>
        <input type="date">
        <br><br>

        <label>Set Username</label>
        <input type = "text" placeholder="Set Username">
        <br><br>

        <label>Set Pasword</label>
        <input type = "text" placeholder="Set Password">
        <br><br>

        <label>Gender</label><br>
        <input type="radio" name="gender"> <label>Male</label><br>
        <input type="radio" name="gender"> <label>Female</label><br>
        <input type="radio" name="gender"> <label>Others</label><br>

        <br>

        <label>Course: </label>
        <select>
            <option>Course</option>
            <option>Java</option>
            <option>HTML</option>
            <option>SQL</option>
        </select>

        <br><br>

        <button>Register</button>

    </form>
</body>
</html>
